<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.6" stop-color="#0b1a22"/>
      <stop offset="1" stop-color="#0a1418"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#00C2FF" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <radialGradient id="orb1" cx="0.5" cy="0.5" r="0.5">
